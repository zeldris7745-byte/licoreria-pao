<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licorería Pau</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0c10; color: #fff; min-height: 100vh; padding: 12px; padding-bottom: 90px; }
        
        .header-card {
            background: linear-gradient(135deg, #1a1c29, #12141f);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .header-bg-drinks {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.12; pointer-events: none;
            display: flex; justify-content: space-around; align-items: center;
            font-size: 1.2rem; filter: drop-shadow(0 0 2px rgba(255,180,0,0.5));
        }

        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; position: relative; z-index: 2; }
        
        .title-container-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .gold-circle-badge {
            width: 44px; height: 44px; border-radius: 50%;
            background: radial-gradient(circle, #2a2215 0%, #151419 100%);
            border: 1.5px dashed rgba(255, 180, 0, 0.6);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(255, 180, 0, 0.2);
            position: relative;
        }
        .gold-circle-badge::after {
            content: ''; position: absolute; inset: -3px; border-radius: 50%;
            border: 1px dotted rgba(255, 180, 0, 0.3);
        }
        .inner-dot { width: 14px; height: 14px; border-radius: 50%; background: #6e7996; border: 2px solid #ffb400; }
        
        h1 { font-size: 1.5rem; color: #ff5e9c; font-style: italic; }
        
        .brindis-container {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 94, 156, 0.4);
            animation: brillarBordes 3s infinite alternate;
        }
        .copa { font-size: 1.25rem; display: inline-block; animation: chocarCopas 1.5s ease-in-out infinite; }
        .copa-left { transform-origin: bottom right; }
        .copa-right { transform-origin: bottom left; transform: scaleX(-1); }
        @keyframes chocarCopas { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(18deg) translateX(2px); } }
        @keyframes brillarBordes { 0% { border-color: rgba(255,94,156,0.3); } 100% { border-color: rgba(0,255,200,0.6); } }

        .offline-badge { background: rgba(0,255,150,0.15); color: #00ff96; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; display: inline-block; position: relative; z-index: 2; }
        .ventas-hoy { margin-top: 8px; font-size: 0.85rem; color: #aaa; position: relative; z-index: 2; }
        .ventas-hoy span { color: #00ff96; font-weight: bold; font-size: 1.1rem; }

        .section-header { font-size: 0.85rem; color: #8892b0; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
        
        .categories-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .cat-card {
            background: #141724;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 14px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 115px;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .cat-card:active { transform: scale(0.97); border-color: rgba(255,180,0,0.5); }
        
        .icon-gold-box {
            width: 42px; height: 42px; border-radius: 12px;
            background: rgba(255, 180, 0, 0.08);
            border: 1px solid rgba(255, 180, 0, 0.25);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 10px;
            position: relative;
        }

        .prod-badge { position: absolute; top: 12px; right: 12px; background: rgba(255,180,0,0.15); color: #ffb400; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; }
        .rapida-badge { position: absolute; top: 12px; right: 12px; background: rgba(0,255,150,0.15); color: #00ff96; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; }
        
        .cat-title { font-size: 1rem; font-weight: bold; margin-bottom: 2px; }
        .cat-sub { font-size: 0.75rem; color: #6e7996; }

        /* Animaciones en íconos */
        .card-cervezas .cat-icon-inner { font-size: 1.5rem; position: relative; display: inline-block; }
        .card-cervezas .cat-icon-inner::after {
            content: '💦'; position: absolute; top: -8px; right: -10px; font-size: 0.65rem;
            animation: destapeChampan 0.8s ease-out infinite;
        }
        @keyframes destapeChampan { 0% { transform: translateY(0) scale(0.5); opacity: 1; } 100% { transform: translateY(-12px) scale(1.3); opacity: 0; } }

        .card-cigarros .cat-icon-inner {
            font-size: 1.5rem; display: inline-block;
            filter: drop-shadow(0 0 3px rgba(255, 30, 30, 0.4));
            animation: aspirarCigarro 2s ease-in-out infinite;
        }
        @keyframes aspirarCigarro { 0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 0, 0, 0.3)); transform: scale(1); } 50% { filter: drop-shadow(0 0 10px rgba(255, 30, 30, 0.9)); transform: scale(1.08); } }

        .card-licores .cat-icon-inner { font-size: 1.5rem; display: inline-block; animation: moverLiquido 2s ease-in-out infinite; }
        @keyframes moverLiquido { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

        .card-refrescos .cat-icon-inner { font-size: 1.5rem; position: relative; display: inline-block; }
        .card-refrescos .cat-icon-inner::before {
            content: ''; position: absolute; top: -8px; left: 45%; width: 3px; height: 10px;
            background: #ff7b00; border-radius: 2px;
            animation: servirSoda 1s linear infinite;
        }
        @keyframes servirSoda { 0% { height: 0; opacity: 1; top: -8px; } 50% { height: 12px; opacity: 1; } 100% { height: 0; opacity: 0; top: 4px; } }

        .snowflake-anim { display: inline-block; font-size: 1.4rem; animation: girarCopo 4s linear infinite; }
        @keyframes girarCopo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Vistas dinámicas ocultas por defecto */
        .view-section { display: none; }
        .view-section.active-view { display: block; }

        /* Panel interno idéntico a imagen de referencia */
        .panel-card {
            background: #141724;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .top-cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
        .back-btn { background: rgba(255,255,255,0.08); color: #fff; border: none; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; }
        .btn-new-prod { background: #ffb400; color: #0b0c10; border: none; padding: 8px 14px; border-radius: 10px; font-weight: bold; font-size: 0.8rem; cursor: pointer; }

        .venta-rapida-box {
            background: #121520;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .vr-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .vr-title { font-size: 0.95rem; font-weight: bold; color: #fff; }
        .btn-edit-fast { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #ffb400; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }
        
        .multiplicador-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 10px; }
        .multiplicador-row span { font-size: 0.8rem; color: #ffa726; font-weight: bold; }
        .mult-controls { display: flex; align-items: center; gap: 12px; }
        .mult-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; width: 28px; height: 28px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .mult-val { font-size: 0.95rem; font-weight: bold; min-width: 16px; text-align: center; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-tile {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .option-tile:active { border-color: #ffb400; background: rgba(255,180,0,0.08); }
        .option-name { font-size: 0.8rem; color: #fff; margin-bottom: 4px; font-weight: 500; }
        .option-price { font-size: 0.8rem; color: #ffb400; font-weight: bold; }

        .inventario-box {
            text-align: center;
            padding: 20px 10px;
            border-top: 1px dashed rgba(255,255,255,0.1);
        }
        .inv-text { font-size: 0.8rem; color: #8892b0; margin-bottom: 12px; line-height: 1.4; }
        .btn-register-inv { background: rgba(0,255,150,0.15); color: #00ff96; border: 1px solid rgba(0,255,150,0.3); padding: 10px 16px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        
        .inv-list-container {
            margin-top: 12px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .inv-item-row {
            background: rgba(255,255,255,0.04);
