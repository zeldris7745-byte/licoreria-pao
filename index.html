<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licorería Pau</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            background-color: #0b0c10; 
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.04' fill-rule='evenodd'%3E%3Ctext x='10' y='25' font-size='14'%3E🍷%3C/text%3E%3Ctext x='65' y='20' font-size='14'%3E🍺%3C/text%3E%3Ctext x='35' y='55' font-size='14'%3E🥂%3C/text%3E%3Ctext x='80' y='65' font-size='14'%3E🥃%3C/text%3E%3Ctext x='15' y='85' font-size='14'%3E🍾%3C/text%3E%3C/g%3E%3C/svg%3E");
            color: #fff; 
            min-height: 100vh; 
            padding: 12px; 
            padding-bottom: 90px; 
        }
        
        .header-card {
            background: linear-gradient(135deg, rgba(26,28,41,0.92), rgba(18,20,31,0.92));
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        .header-bg-drinks {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.15; pointer-events: none;
            display: flex; justify-content: space-around; align-items: center;
            font-size: 1.3rem; filter: drop-shadow(0 0 3px rgba(255,180,0,0.6));
            animation: flotarFondo 6s ease-in-out infinite alternate;
        }
        @keyframes flotarFondo {
            0% { transform: translateY(-3px) scale(0.98); }
            100% { transform: translateY(3px) scale(1.02); }
        }

        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; position: relative; z-index: 2; }
        
        .title-container-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .gold-circle-badge {
            width: 44px; height: 44px; border-radius: 50%;
            background: radial-gradient(circle, #2a2215 0%, #151419 100%);
            border: 1.5px dashed rgba(255, 180, 0, 0.6);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(255, 180, 0, 0.2);
            position: relative;
        }
        .gold-circle-badge::after {
            content: ''; position: absolute; inset: -3px; border-radius: 50%;
            border: 1px dotted rgba(255, 180, 0, 0.3);
        }
        .inner-dot { width: 14px; height: 14px; border-radius: 50%; background: #6e7996; border: 2px solid #ffb400; animation: pulsoPunto 2s infinite; }
        @keyframes pulsoPunto { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); box-shadow: 0 0 8px #ffb400; } }
        
        h1.titulo-animado {
            font-size: 1.5rem;
            color: #ff5e9c;
            font-style: italic;
            animation: brilloNeonTitulo 3s ease-in-out infinite;
        }
        @keyframes brilloNeonTitulo {
            0% { opacity: 0.85; text-shadow: 0 0 5px rgba(255,94,156,0.4), 0 0 10px rgba(255,180,0,0.2); transform: translateY(0px); }
            50% { opacity: 1; text-shadow: 0 0 12px rgba(255,94,156,0.9), 0 0 25px rgba(255,215,0,0.7); transform: translateY(-2px); }
            100% { opacity: 0.85; text-shadow: 0 0 5px rgba(255,94,156,0.4), 0 0 10px rgba(255,180,0,0.2); transform: translateY(0px); }
        }
        
        .brindis-container {
            display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(255, 94, 156, 0.4); animation: brillarBordes 3s infinite alternate;
        }
        .copa { font-size: 1.25rem; display: inline-block; animation: chocarCopas 1.5s ease-in-out infinite; }
        .copa-left { transform-origin: bottom right; }
        .copa-right { transform-origin: bottom left; transform: scaleX(-1); }
        @keyframes chocarCopas { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(18deg) translateX(2px); } }
        @keyframes brillarBordes { 0% { border-color: rgba(255,94,156,0.3); } 100% { border-color: rgba(0,255,200,0.6); } }

        .offline-badge { background: rgba(0,255,150,0.15); color: #00ff96; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; display: inline-block; position: relative; z-index: 2; font-weight: bold; }
        .ventas-hoy { margin-top: 8px; font-size: 0.85rem; color: #aaa; position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .ventas-hoy span.monto-v { color: #00ff96; font-weight: bold; font-size: 1.1rem; }
        .cambio-box { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 10px; font-size: 0.75rem; color: #fff; display: flex; align-items: center; gap: 6px; }
        .cambio-box input { background: #0b0c10; border: 1px solid rgba(255,255,255,0.2); color: #ffb400; width: 65px; border-radius: 6px; padding: 3px 6px; font-weight: bold; text-align: right; }

        /* Buscador externo con capa súper alta para que flote perfectamente sobre todo */
        .search-container { position: relative; z-index: 9999; margin-bottom: 12px; }
        .search-input { width: 100%; background: #141724; border: 1.5px solid rgba(255, 180, 0, 0.7); border-radius: 12px; padding: 12px 14px; color: #fff; font-size: 0.95rem; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
