<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licorería Pao - Control y Venta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f17;
      --card-bg: rgba(20, 26, 38, 0.85);
      --borde-tarjeta: rgba(255, 255, 255, 0.1);
      --input-bg: #161f30;
      --acento: #f59e0b;
      --coca-accent: #10b981;
      --texto-principal: #f3f4f6;
      --texto-silenciado: #9ca3af;
      --peligro: #ef4444;
      --exito: #10b981;
      --radio: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-main); color: var(--texto-principal); min-height: 100vh; padding: 14px; padding-bottom: 40px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    h1 { font-size: 1.35rem; color: var(--acento); }
    .day-summary-box { background: var(--input-bg); border: 1px solid var(--borde-tarjeta); padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; display: flex; gap: 12px; align-items: center; }
    .day-summary-box strong { color: var(--exito); }
    .container { display: grid; gap: 14px; max-width: 1200px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--borde-tarjeta); border-radius: var(--radio); padding: 14px; backdrop-filter: blur(10px); }
    .card h3 { font-size: 1rem; margin-bottom: 10px; color: var(--acento); display: flex; justify-content: space-between; align-items: center; }
    
    .coca-special-box { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; padding: 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
    .coca-title { font-weight: 700; color: var(--coca-accent); font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }
    .coca-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .coca-opt-btn { background: var(--input-bg); border: 1px solid var(--borde-tarjeta); color: var(--texto-principal); padding: 10px; border-radius: 10px; text-align: left; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 2px; }
    .coca-opt-btn:hover { border-color: var(--coca-accent); background: rgba(16, 185, 129, 0.15); }
    .coca-opt-name { font-weight: 600; font-size: 0.82rem; }
    .coca-opt-price { color: var(--coca-accent); font-size: 0.78rem; font-weight: 700; }
    .coca-qty-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-main); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .prod-card { background: var(--input-bg); border: 1px solid var(--borde-tarjeta); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .prod-info { display: flex; flex-direction: column; }
    .prod-name { font-weight: 600; font-size: 0.85rem; }
    .prod-price { color: var(--acento); font-size: 0.8rem; font-weight: 700; }
    .qty-control { display: flex; align-items: center; justify-content: space-between; background: var(--bg-main); border-radius: 8px; padding: 2px; border: 1px solid var(--borde-tarjeta); }
    .qty-btn { background: transparent; border: none; color: var(--texto-principal); width: 28px; height: 28px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .qty-num { font-size: 0.85rem; font-weight: 600; min-width: 20px; text-align: center; }
    .add-btn { background: var(--acento); color: #000; border: none; padding: 6px; border-radius: 8px; font-weight: 700; font-size: 0.75rem; cursor: pointer; }
    
    .cart-list { margin: 10px 0; max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; background: var(--input-bg); padding: 8px 10px; border-radius: 8px; font-size: 0.8rem; }
    .total-section { font-size: 1rem; font-weight: 700; margin: 10px 0; display: flex; justify-content: space-between; }
    .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-action { background: var(--exito); color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
    .btn-danger { background: var(--peligro); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
    .history-box { font-size: 0.8rem; color: var(--texto-silenciado); background: var(--input-bg); padding: 10px; border-radius: 10px; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍻 Licorería Pao</h1>
      <div class="day-summary-box">
        <span>Ventas Día: <strong id="dailyTotalText">0.00 BOL</strong></span>
        <span style="font-size:0.75rem; color:var(--texto-silenciado);" id="dailyCountText">(0 uds)</span>
      </div>
    </header>

    <!-- Sección Especial de Coca -->
    <div class="card">
      <h3>🌿 Venta de Coca Rápida</h3>
      <div class="coca-special-box">
        <div class="coca-title">
          <span>Seleccionar porción / tipo</span>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="qty-btn" style="width:24px;height:24px;background:var(--input-bg);border-radius:6px;" onclick="changeCocaQty(-1)">-</button>
            <span id="cocaTempQty" style="font-size:0.85rem;font-weight:700;min-width:18px;text-align:center;">1</span>
            <button class="qty-btn" style="width:24px;height:24px;background:var(--input-bg);border-radius:6px;" onclick="changeCocaQty(1)">+</button>
            <span style="font-size:0.75rem;color:var(--texto-silenciado);">porción(es)</span>
          </div>
        </div>
        <div class="coca-options">
          <button class="coca-opt-btn" onclick="addCocaCustom('Coca de 5 Bs', 5)">
            <span class="coca-opt-name">Porción 5 Bs</span>
            <span class="coca-opt-price">5.00 BOL</span>
          </button>
          <button class="coca-opt-btn" onclick="addCocaCustom('Coca Machucada (10 Bs)', 10)">
            <span class="coca-opt-name">Machucada / 10 Bs</span>
            <span class="coca-opt-price">10.00 BOL</span>
          </button>
          <button class="coca-opt-btn" onclick="addCocaCustom('Porción 15 Bs', 15)">
            <span class="coca-opt-name">Porción 15 Bs</span>
            <span class="coca-opt-price">15.00 BOL</span>
          </button>
          <button class="coca-opt-btn" onclick="addCocaCustom('1 Libra de Coca', 40)">
            <span class="coca-opt-name">1 Libra</span>
            <span class="coca-opt-price">40.00 BOL</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Sección de Productos / Bebidas / Bicos -->
    <div class="card">
      <h3>Bebidas, Cervezas y Bicos (por unidades)</h3>
      <div class="products-grid" id="productGrid"></div>
    </div>

    <!-- Carrito y Control de Jornada -->
    <div class="card">
      <h3>Carrito de Venta Actual</h3>
      <div class="cart-list" id="cartList"></div>
      <div class="total-section">
        <span>Total Venta:</span>
        <span id="currentTotal">0.00 BOL</span>
      </div>
      <div class="actions-grid">
        <button class="btn-action" onclick="completeSale()">Cobrar / Vender</button>
        <button class="btn-danger" onclick="endDayAndReset()">Terminar Jornada</button>
      </div>
    </div>

    <div class="card" id="historyCard" style="display:none;">
      <h3>Resumen del Día Guardado</h3>
      <div class="history-box" id="historyLog"></div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: 'Singani Rivas', price: 45 },
      { id: 2, name: 'Cerveza Paceña 6pk', price: 65 },
      { id: 3, name: 'Fernet Branca', price: 95 },
      { id: 4, name: 'Ron Abuelo', price: 80 },
      { id: 5, name: 'Cerveza Huari 6pk', price: 70 },
      { id: 6, name: 'Singani San Pedro', price: 50 },
      { id: 7, name: 'Cigarros Marlboro', price: 18 },
      { id: 8, name: 'Soda 3L (Pepsi/Coca)', price: 17 }
    ];

    const selectQty = {};
    products.forEach(p => selectQty[p.id] = 1);
    let cocaMultiplier = 1;

    let cart = [];
    let dailyRevenue = parseFloat(localStorage.getItem('pao_daily_rev') || '0');
    let dailyItemsCount = parseInt(localStorage.getItem('pao_daily_count') || '0', 10);
    let dayLogHistory = localStorage.getItem('pao_day_history') || '';

    const grid = document.getElementById('productGrid');
    const cartList = document.getElementById('cartList');
    const currentTotal = document.getElementById('currentTotal');
    const dailyTotalText = document.getElementById('dailyTotalText');
    const dailyCountText = document.getElementById('dailyCountText');
    const historyCard = document.getElementById('historyCard');
    const historyLog = document.getElementById('historyLog');
    const cocaTempQtyEl = document.getElementById('cocaTempQty');

    function updateDaySummaryDisplay() {
      dailyTotalText.innerText = `${dailyRevenue.toFixed(2)} BOL`;
      dailyCountText.innerText = `(${dailyItemsCount} uds/porciones vendidas hoy)`;
      if (dayLogHistory) {
        historyCard.style.display = 'block';
        historyLog.innerHTML = dayLogHistory;
      }
    }

    function changeTempQty(id, delta) {
      if (!selectQty[id]) selectQty[id] = 1;
      selectQty[id] += delta;
      if (selectQty[id] < 1) selectQty[id] = 1;
      renderProducts();
    }

    function changeCocaQty(delta) {
      cocaMultiplier += delta;
      if (cocaMultiplier < 1) cocaMultiplier = 1;
      cocaTempQtyEl.innerText = cocaMultiplier;
    }

    function addCocaCustom(name, unitPrice) {
      const finalPrice = unitPrice * cocaMultiplier;
      const itemName = cocaMultiplier > 1 ? `${name} x${cocaMultiplier}` : name;
      
      const found = cart.find(c => c.name === name);
      if (found) {
        found.qty += cocaMultiplier;
      } else {
        cart.push({ id: 'coca_' + Date.now(), name: name, price: unitPrice, qty: cocaMultiplier });
      }
      cocaMultiplier = 1;
      cocaTempQtyEl.innerText = cocaMultiplier;
      renderCart();
    }

    function renderProducts() {
      grid.innerHTML = products.map(p => `
        <div class="prod-card">
          <div class="prod-info">
            <span class="prod-name">${p.name}</span>
            <span class="prod-price">${p.price} BOL</span>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="changeTempQty(${p.id}, -1)">-</button>
            <span class="qty-num">${selectQty[p.id]}</span>
            <button class="qty-btn" onclick="changeTempQty(${p.id}, 1)">+</button>
          </div>
          <button class="add-btn" onclick="addSelectedToCart(${p.id})">Agregar</button>
        </div>
      `).join('');
    }

    function addSelectedToCart(id) {
      const prod = products.find(p => p.id === id);
      const qtyToAdd = selectQty[id] || 1;
      const found = cart.find(c => c.id === id);
      if (found) {
        found.qty += qtyToAdd;
      } else {
        cart.push({ ...prod, qty: qtyToAdd });
      }
      selectQty[id] = 1;
      renderProducts();
      renderCart();
    }

    function renderCart() {
      if (cart.length === 0) {
        cartList.innerHTML = '<p style="color:var(--texto-silenciado);font-size:0.8rem;">Carrito vacío</p>';
      } else {
        cartList.innerHTML = cart.map(item => `
          <div class="cart-item">
            <span><strong>${item.name}</strong> x${item.qty}</span>
            <span>${(item.price * item.qty).toFixed(2)} BOL</span>
          </div>
        `).join('');
      }
      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      currentTotal.innerText = `${total.toFixed(2)} BOL`;
    }

    function completeSale() {
      if (cart.length === 0) return alert('El carrito está vacío');
      const saleTotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      const countSaleUnits = cart.reduce((acc, i) => acc + i.qty, 0);

      dailyRevenue += saleTotal;
      dailyItemsCount += countSaleUnits;

      localStorage.setItem('pao_daily_rev', dailyRevenue.toString());
      localStorage.setItem('pao_daily_count', dailyItemsCount.toString());

      alert(`¡Venta cobrada con éxito por ${saleTotal.toFixed(2)} BOL!`);
      cart = [];
      renderCart();
      updateDaySummaryDisplay();
    }

    function endDayAndReset() {
      if (dailyRevenue === 0 && dailyItemsCount === 0) {
        return alert('No hay ventas registradas en esta jornada todavía.');
      }
      if (!confirm(`¿Estás segura de TERMINAR LA JORNADA?\nTotal acumulado de hoy: ${dailyRevenue.toFixed(2)} BOL (${dailyItemsCount} unidades/porciones).\nEsto guardará el reporte y reiniciará el día a 0.`)) {
        return;
      }

      const now = new Date();
      const timeStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
      const summaryText = `<strong>Jornada cerrada el ${timeStr}</strong><br>Total Ventas: ${dailyRevenue.toFixed(2)} BOL | Unidades/Porciones: ${dailyItemsCount}<br>---<br>` + dayLogHistory;

      dayLogHistory = summaryText;
      localStorage.setItem('pao_day_history', dayLogHistory);

      dailyRevenue = 0;
      dailyItemsCount = 0;
      localStorage.setItem('pao_daily_rev', '0');
      localStorage.setItem('pao_daily_count', '0');

      cart = [];
      renderCart();
      updateDaySummaryDisplay();
      alert('Jornada finalizada y guardada. Las ventas del día se reiniciaron a 0.');
    }

    renderProducts();
    renderCart();
    updateDaySummaryDisplay();
  </script>
</body>
</html>
