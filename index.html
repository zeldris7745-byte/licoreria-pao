<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licorería Pau</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            background-color: #0b0c10; 
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.04' fill-rule='evenodd'%3E%3Ctext x='10' y='25' font-size='14'%3E🍷%3C/text%3E%3Ctext x='65' y='20' font-size='14'%3E🍺%3C/text%3E%3Ctext x='35' y='55' font-size='14'%3E🥂%3C/text%3E%3Ctext x='80' y='65' font-size='14'%3E🥃%3C/text%3E%3Ctext x='15' y='85' font-size='14'%3E🍾%3C/text%3E%3C/g%3E%3C/svg%3E");
            color: #fff; 
            min-height: 100vh; 
            padding: 12px; 
            padding-bottom: 90px; 
        }
        
        .header-card {
            background: linear-gradient(135deg, rgba(26,28,41,0.95), rgba(18,20,31,0.95));
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            z-index: 100;
        }

        .header-bg-drinks {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.15; pointer-events: none;
            display: flex; justify-content: space-around; align-items: center;
            font-size: 1.3rem; filter: drop-shadow(0 0 3px rgba(255,180,0,0.6));
            border-radius: 16px;
            overflow: hidden;
        }

        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; position: relative; z-index: 2; }
        
        .title-container-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .gold-circle-badge {
            width: 44px; height: 44px; border-radius: 50%;
            background: radial-gradient(circle, #2a2215 0%, #151419 100%);
            border: 1.5px dashed rgba(255, 180, 0, 0.6);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(255, 180, 0, 0.2);
            position: relative;
        }
        .gold-circle-badge::after {
            content: ''; position: absolute; inset: -3px; border-radius: 50%;
            border: 1px dotted rgba(255, 180, 0, 0.3);
        }
        .inner-dot { width: 14px; height: 14px; border-radius: 50%; background: #6e7996; border: 2px solid #ffb400; animation: pulsoPunto 2s infinite; }
        @keyframes pulsoPunto { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); box-shadow: 0 0 8px #ffb400; } }
        
        h1.titulo-animado {
            font-size: 1.5rem;
            color: #ff5e9c;
            font-style: italic;
        }
        
        .brindis-container {
            display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(255, 94, 156, 0.4);
        }
        .copa { font-size: 1.25rem; display: inline-block; }

        .offline-badge { background: rgba(0,255,150,0.15); color: #00ff96; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; display: inline-block; position: relative; z-index: 2; font-weight: bold; }
        .ventas-hoy { margin-top: 8px; font-size: 0.85rem; color: #aaa; position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .ventas-hoy span.monto-v { color: #00ff96; font-weight: bold; font-size: 1.1rem; }
        .cambio-box { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 10px; font-size: 0.75rem; color: #fff; display: flex; align-items: center; gap: 6px; }
        .cambio-box input { background: #0b0c10; border: 1px solid rgba(255,255,255,0.2); color: #ffb400; width: 65px; border-radius: 6px; padding: 3px 6px; font-weight: bold; text-align: right; }

        .search-container { margin-top: 12px; position: relative; z-index: 1000; }
        .search-input { width: 100%; background: #141724; border: 1.5px solid rgba(255, 180, 0, 0.7); border-radius: 10px; padding: 11px 14px; color: #fff; font-size: 0.95rem; outline: none; }
        .search-input:focus { border-color: #00ff96; }
        .search-results-dropdown { 
            position: absolute; top: calc(100% + 6px); left: 0; right: 0; 
            background: #141724; border: 1.5px solid #ffb400; border-radius: 10px; 
            max-height: 220px; overflow-y: auto; z-index: 99999; display: none; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.95); 
        }
        .search-result-item { padding: 12px 14px; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.08); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .search-result-item:hover { background: rgba(255,180,0,0.25); }

        .section-header { font-size: 0.85rem; color: #8892b0; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
        
        .categories-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; position: relative; z-index: 1; }
        .cat-card {
            background: rgba(20, 23, 36, 0.9); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px; padding: 14px; position: relative; display: flex; flex-direction: column;
            justify-content: space-between; min-height: 115px; cursor: pointer; transition: transform 0.15s, border-color 0.15s;
        }
        .cat-card:active { transform: scale(0.97); border-color: rgba(255,180,0,0.5); }
        
        .icon-gold-box {
            width: 42px; height: 42px; border-radius: 12px; background: rgba(255, 180, 0, 0.08);
            border: 1px solid rgba(255, 180, 0, 0.25); display: flex; align-items: center; justify-content: center; margin-bottom: 10px;
        }
        .icon-animated { font-size: 1.4rem; display: inline-block; }

        .prod-badge { position: absolute; top: 12px; right: 12px; background: rgba(255,180,0,0.15); color: #ffb400; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; }
        .cat-title { font-size: 1rem; font-weight: bold; margin-bottom: 2px; }
        .cat-sub { font-size: 0.75rem; color: #6e7996; }

        .view-section { display: none; }
        .view-section.active-view { display: block; }

        .panel-card { background: rgba(20, 23, 36, 0.92); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .top-cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
        .back-btn { background: rgba(255,255,255,0.08); color: #fff; border: none; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; }
        .btn-new-prod { background: #ffb400; color: #0b0c10; border: none; padding: 8px 14px; border-radius: 10px; font-weight: bold; font-size: 0.8rem; cursor: pointer; }

        .venta-rapida-box { background: rgba(18, 21, 32, 0.85); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
        .vr-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .vr-title { font-size: 0.95rem; font-weight: bold; color: #fff; }
        .btn-edit-fast { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #ffb400; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }
        
        .multiplicador-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; background: rgba(0,0,0,0.25); padding: 8px 12px; border-radius: 10px; }
        .multiplicador-row span { font-size: 0.8rem; color: #ffa726; font-weight: bold; }
        .mult-controls { display: flex; align-items: center; gap: 12px; }
        .mult-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; width: 28px; height: 28px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .mult-val { font-size: 0.95rem; font-weight: bold; min-width: 16px; text-align: center; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-tile { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px; cursor: pointer; }
        .option-tile:active { border-color: #ffb400; background: rgba(255,180,0,0.08); }
        .option-name { font-size: 0.8rem; color: #fff; margin-bottom: 4px; font-weight: 500; }
        .option-price { font-size: 0.8rem; color: #ffb400; font-weight: bold; }

        .inventario-box { text-align: center; padding: 20px 10px; border-top: 1px dashed rgba(255,255,255,0.1); }
        .inv-text { font-size: 0.8rem; color: #8892b0; margin-bottom: 12px; line-height: 1.4; }
        .btn-register-inv { background: rgba(0,255,150,0.15); color: #00ff96; border: 1px solid rgba(0,255,150,0.3); padding: 10px 16px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .inv-list-container { margin-top: 12px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
        .inv-item-row { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }

        .compra-item-row { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; border-left: 3px solid #ffb400; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 5000; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #141724; border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 100%; max-width: 380px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .modal-card h3 { color: #ffb400; font-size: 1.05rem; margin-bottom: 14px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.75rem; color: #8892b0; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; background: #0b0c10; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; padding: 10px; font-size: 0.85rem; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

        .cart-card { background: rgba(20, 23, 36, 0.92); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .cart-title { font-size: 1rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .cart-items-count { font-size: 0.75rem; color: #8892b0; }
        .cart-empty { font-size: 0.85rem; color: #6e7996; margin-bottom: 16px; }
        
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-bottom: 8px; background: rgba(255,255,255,0.03); padding: 6px 10px; border-radius: 8px; }
        .cart-item-controls { display: flex; align-items: center; gap: 6px; }
        .cart-qty-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 22px; height: 22px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }

        .total-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 12px; margin-bottom: 16px; }
        .total-label { font-size: 0.9rem; font-weight: bold; }
        .total-value { font-size: 1.1rem; color: #ffb400; font-weight: bold; }

        .action-buttons { display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px; }
        .btn { padding: 14px; border-radius: 12px; border: none; font-weight: bold; font-size: 0.85rem; text-align: center; cursor: pointer; }
        .btn-primary { background: #00ff96; color: #0b0c10; }
        .btn-danger { background: #ff4757; color: #fff; }

        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(18, 20, 31, 0.95); backdrop-filter: blur(6px); border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-around; padding: 12px 4px; z-index: 200; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: #6e7996; gap: 5px; text-decoration: none; cursor: pointer; border: none; background: transparent; }
        .nav-item.active { color: #ffb400; font-weight: 500; }
    </style>
</head>
<body>

    <div class="header-card">
        <div class="header-bg-drinks">
            <span>🍷</span><span>🍺</span><span>🥂</span><span>🥃</span><span>🍷</span><span>🍺</span><span>🥂</span><span>🥃</span>
        </div>
        <div class="header-top">
            <div class="title-container-wrapper">
                <div class="gold-circle-badge">
                    <div class="inner-dot"></div>
                </div>
                <h1 class="titulo-animado">Licorería Pau</h1>
                <div class="brindis-container" title="¡Salud!">
                    <span class="copa copa-left">🥂</span>
                    <span class="copa copa-right">🥂</span>
                </div>
            </div>
            <div class="offline-badge">⚡ MODO OFFLINE PURO 100%</div>
        </div>
        <div class="ventas-hoy">
            <div>VENTAS HOY<br><span class="monto-v">Bs. <strong id="totalVentasText">0.00</strong></span></div>
            <div class="cambio-box">
                <span>Cambio inicial (Bs.):</span>
                <input type="number" id="inputCambioInicial" step="0.5" value="0.00" onchange="actualizarCambioInicial(this.value)">
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="inputBuscadorGlobal" class="search-input" placeholder="🔍 Buscar producto para vender rápido..." oninput="buscarProductosGlobal(this.value)" autocomplete="off">
            <div id="searchResultsDropdown" class="search-results-dropdown"></div>
        </div>
    </div>

    <!-- VISTA 1: VENDER -->
    <div id="view-vender" class="view-section active-view">
        <div class="section-header">
            <span>SELECCIONA UNA CATEGORÍA</span>
            <span style="color:#00ff96;">● SIN INTERNET / LOCAL</span>
        </div>
        
        <div
